<g id="08-typografia">
<text x="60" y="1153" class="black" font-size="96" letter-spacing="3" fill="#2B231A">~900 SAMÔT</text>
<text x="62" y="1197" class="mono" font-size="17" letter-spacing="3.2" fill="#C4522A" font-weight="600">KOPANICE JAVORNÍKOV · OD 17. STOROČIA</text>
<text x="60" y="1247" class="serif" font-size="20.5" fill="#2B231A">Kto sem prišiel klčovať les, dal miestu svoje meno. Rody sa stali adresami</text>
<text x="60" y="1274" class="serif" font-size="20.5" fill="#2B231A">a adresy kontrolami na trati. Kto tadiaľ bežal, pozná ich po poradí —</text>
<text x="60" y="1301" class="serif" font-size="20.5" fill="#2B231A">a vie, pri ktorej sa mu minula voda.</text>
<line x1="60" y1="1318" x2="940" y2="1318" stroke="#2B231A" stroke-width="1.4"/>
<text x="60" y="1348" class="mono" font-size="15" letter-spacing="1.5" fill="#2B231A">Kopaničiarske osady  ·  Javorníky  ·  A3</text>
<text x="940" y="1348" class="mono" font-size="15" letter-spacing="1.5" fill="#2B231A" text-anchor="end">Edícia 1 / 100  ·  ___________</text>
</g>
