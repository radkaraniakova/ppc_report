<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseMetrics — PPC Reporting Dashboard</title>
  <meta name="description" content="Multi-channel PPC reporting dashboard for marketing agencies. Track Google Ads, Meta, and TikTok performance in one place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
</head>
<body>

  <!-- ===================== ALERTS BAR ===================== -->
  <div id="alerts-bar" class="alerts-bar hidden">
    <div class="alerts-inner">
      <span class="alert-icon">⚠️</span>
      <span id="alert-text"></span>
      <button onclick="document.getElementById('alerts-bar').classList.add('hidden')" class="alert-close">✕</button>
    </div>
  </div>

  <div class="app-shell">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </div>
        <span class="brand-name">PulseMetrics</span>
      </div>

      <!-- Client Switcher -->
      <div class="client-switcher">
        <label class="client-label">Client</label>
        <div class="select-wrapper">
          <select id="client-select" onchange="app.setClient(this.value)">
            <option value="acme">Acme Corp</option>
            <option value="bloom">Bloom Fashion</option>
            <option value="tekko">Tekko Electronics</option>
          </select>
          <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>

      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" class="nav-item active" data-section="overview" onclick="app.navigate('overview'); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span>Overview</span>
          </a></li>
          <li><a href="#" class="nav-item" data-section="campaigns" onclick="app.navigate('campaigns'); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg>
            <span>Campaigns</span>
          </a></li>
          <li><a href="#" class="nav-item" data-section="adsets" onclick="app.navigate('adsets'); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4m0 12v4M4.22 4.22l2.83 2.83m9.9 9.9 2.83 2.83M2 12h4m12 0h4M4.22 19.78l2.83-2.83m9.9-9.9 2.83-2.83"/></svg>
            <span>Ad Sets / Ad Groups</span>
          </a></li>
          <li><a href="#" class="nav-item" data-section="ads" onclick="app.navigate('ads'); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
            <span>Ads</span>
          </a></li>
          <li><a href="#" class="nav-item" data-section="keywords" onclick="app.navigate('keywords'); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <span>Keywords</span>
          </a></li>
          <li><a href="#" class="nav-item" data-section="audiences" onclick="app.navigate('audiences'); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Audiences</span>
          </a></li>
          <li><a href="#" class="nav-item" data-section="products" onclick="app.navigate('products'); return false;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <span>Products</span>
            <span class="nav-badge">E-com</span>
          </a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="data-freshness">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Refreshed daily · 06:00 UTC</span>
        </div>
      </div>
    </aside>

    <!-- ===================== MAIN ===================== -->
    <div class="main-wrapper">

      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">Overview</h1>
        </div>
        <div class="topbar-right">
          <!-- Platform Filter -->
          <div class="filter-group">
            <label>Platform</label>
            <div class="select-wrapper sm">
              <select id="platform-select" onchange="app.setFilter('platform', this.value)">
                <option value="all">All Platforms</option>
                <option value="google">Google Ads</option>
                <option value="meta">Meta Ads</option>
                <option value="tiktok">TikTok Ads</option>
              </select>
              <svg class="select-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
          </div>

          <!-- Date Range Filter -->
          <div class="filter-group">
            <label>Date Range</label>
            <div class="date-range-picker">
              <div class="date-quick-btns" id="date-quick-btns">
                <button class="dq-btn" data-range="today" onclick="app.setDateRange('today')">Today</button>
                <button class="dq-btn" data-range="yesterday" onclick="app.setDateRange('yesterday')">Yesterday</button>
                <button class="dq-btn active" data-range="7d" onclick="app.setDateRange('7d')">7D</button>
                <button class="dq-btn" data-range="14d" onclick="app.setDateRange('14d')">14D</button>
                <button class="dq-btn" data-range="30d" onclick="app.setDateRange('30d')">30D</button>
                <button class="dq-btn" data-range="mom" onclick="app.setDateRange('mom')">MoM</button>
                <button class="dq-btn" data-range="yoy" onclick="app.setDateRange('yoy')">YoY</button>
                <button class="dq-btn" data-range="custom" onclick="app.openCustomDatePicker()">Custom</button>
              </div>
              <div id="custom-date-wrapper" class="custom-date-wrapper hidden">
                <input type="text" id="custom-date-range" placeholder="Select date range..." readonly />
              </div>
            </div>
          </div>

          <!-- Export -->
          <button class="btn-export" onclick="app.exportCSV()" id="export-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export CSV
          </button>
        </div>
      </header>

      <!-- CONTENT AREA -->
      <main class="content" id="content">
        <!-- Rendered by JS -->
      </main>

    </div>
  </div>

  <!-- ANNOTATION MODAL -->
  <div id="annotation-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Add Annotation</h2>
        <button onclick="app.closeAnnotationModal()" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <label>Date</label>
        <input type="text" id="annotation-date" class="modal-input" placeholder="YYYY-MM-DD" />
        <label>Note</label>
        <textarea id="annotation-note" class="modal-textarea" placeholder="e.g. Campaign A launch, budget change..."></textarea>
      </div>
      <div class="modal-footer">
        <button onclick="app.closeAnnotationModal()" class="btn-secondary">Cancel</button>
        <button onclick="app.saveAnnotation()" class="btn-primary">Save Note</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/tables.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
